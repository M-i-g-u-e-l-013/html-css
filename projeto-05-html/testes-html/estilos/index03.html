<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/project-html-css/projeto-05-html/imagens/logo-tec.png" type="image/x-icon">
    <title>testes.com</title>
</head>
<body>
    <header>
        <h1>Sistema de Cadastros</h1>
        <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    </header>
    <nav>
        <a href="#">Home</a>
        <a href="#">Curiosidades</a>
        <a href="#">Termos de Uso</a>
    </nav>
    <main>
        <fieldset>
            <legend>Dados Pessoais</legend>

            <div>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" placeholder="Digite seu nome:" >
            </div>

            <div>
                <label for="isobrenome">Sobrenome:</label>
                <input type="text" name="sobrenome" id="isobrenome" placeholder="Digite seu sobrenome:">
            </div>

            <div>
                <label for="iidade">Idade:</label>
                <input type="number" name="idade" id="iidade" placeholder="Digite sua idade:">
            </div>

            <div>
                <label for="iemail">E-mail:</label>
                <input type="email" name="email" id="iemail" placeholder="Digite seu e-mail:">
            </div>
        </fieldset>

        <fieldset>
            
            <legend>Informações Extras</legend>

            <div>
                <label for="idata">Data de Nascimento:</label>
                <input type="date" name="data" id="idata">
            </div>

            <div>
                <label for="itelefone">Telefone:</label>
                <input type="tel" name="telefone" id="itelefone" placeholder="(xx) xxxx-xxxx">
            </div>

            <div>
                <label for="ipais"><b>Pais:</b></label>
                <select name="pais" id="pais" required>
                <option value="">Selecione seu país</option>
                <option value="brasil">Brasil</option>
                <option value="portugal">Portugal</option>
                <option value="angola">Angola</option>
                <option value="moçambique">Moçambique</option>
                </select>
            </div>

        </fieldset>

        <fieldset>

            <legend>Sexo</legend>

            <div>
                <label for="sxmasculino">Masculino</label>
                <input type="radio" name="sexo" id="sxmasculino" required>
            </div>

            <div>
                <label for="sxfeminino">Feminino</label>
                <input type="radio" name="sexo" id="sxfeminino" required>
            </div>
        </fieldset>
    </main>
</body>
</html>
